<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports science WEB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
    }
    .iframe-container {
      width: 100%;
      height: 100vh;
      border: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- นำ URL ของ Web App (ที่ลงท้ายด้วย /exec) มาใส่ใน src -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbxgueKtOFiZUM6jOLWL0p9HhYFimCTdR2mxNJSPUl_qeKbzbRlJDFZmDRxJYGH0XJh4mA/exec" 
      title="เว็บคณะวิทยาศาสตร์การกีฬา มหาวิทยาลัยการกีฬาแห่งชาติ วิทยาเขตมหาสารคาม"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
